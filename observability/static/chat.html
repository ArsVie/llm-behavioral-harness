<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lily</title>
<link rel="icon" type="image/png" href="/static/lily.png">
<link rel="apple-touch-icon" href="/static/lily.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-presence="away">
<div class="page page-narrow">

  <header class="topbar card">
    <div class="topline">
      <div class="brand">
        <img class="mark" src="/static/lily.png" alt="" aria-hidden="true">
        <div>
          <h1>Lily</h1>
          <p class="sub">same conversation as Telegram</p>
        </div>
      </div>
      <nav class="viewswitch pages" aria-label="Pages">
        <a class="vbtn" href="/chat" aria-current="page">Chat</a><a class="vbtn" href="/debug">Debug</a><a class="vbtn" href="/setup">Setup</a>
      </nav>
      <button type="button" class="btn push" id="notify" title="Browser notifications for her messages">Notifications off</button>
      <button type="button" class="btn btn-call" id="call" title="Call her (opens the call window on the desktop)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>
        Call
      </button>
    </div>
  </header>

  <main class="chat-grid">
    <section class="card stage">
      <div id="face" aria-label="Lily"></div>
      <span class="chip chip-quiet" id="expr" hidden></span>
    </section>
    <section class="card chat-card">
      <div class="card-head">
        <h2>Conversation</h2>
        <span class="chip" id="status" data-state="unknown">connecting…</span>
      </div>
      <div id="log" aria-live="polite"></div>
      <div id="typing"></div>
      <div class="tray" id="tray" hidden></div>
      <form class="composer" id="form">
        <button type="button" class="btn btn-attach" id="attach" title="Attach photos (or paste, or drop them here)" aria-label="Attach photos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
        </button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <textarea id="text" rows="1" placeholder="Message Lily…" aria-label="Message"></textarea>
        <button class="btn btn-accent" id="send" type="submit">Send</button>
      </form>
    </section>
  </main>

</div>
<script type="module" src="/static/chat.js"></script>
</body>
</html>
