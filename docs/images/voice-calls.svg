<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">Voice calls</title>
  <desc id="d">When he calls, she decides whether to pick up with a decision that rides her own turn. Answered, a local voice client talks to the harness over HTTP: each thing he says is a turn whose reply streams back sentence by sentence, and the client reports what was actually heard, which is all that is stored. A missed call becomes a text. The panel at the bottom gives aggregate numbers from the live run of 3 to 10 October 2026.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
    .h { font-size: 20px; font-weight: 600; }
    .sub { font-size: 13px; fill: #52514e; }
    .bt { font-size: 14px; font-weight: 600; }
    .p { font-size: 11.5px; fill: #8a8984; }
    .b { font-size: 12px; fill: #2b2a28; }
    .m { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11.5px; fill: #1f4f8f; }
    .l { font-size: 11px; fill: #52514e; }
    .big { font-size: 26px; font-weight: 600; fill: #0b0b0b; }
    .w { stroke: #52514e; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="0" y="0" width="1000" height="560" rx="14" fill="#fcfcfb" stroke="#d9d8d3"/>
  <text x="24" y="38" class="h">Voice calls</text>
  <text x="24" y="59" class="sub">harness/call.py, runtime.py, session.py. A call is part of the same conversation, not a separate bot.</text>

  <!-- ring and decision -->
  <rect x="24" y="84" width="220" height="168" rx="10" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="38" y="107" class="bt">1  He calls</text>
  <text x="38" y="129" class="b">The ring is an event steer.</text>
  <text x="38" y="146" class="b">She decides with</text>
  <text x="38" y="163" class="m">tool_decide_call</text>
  <text x="38" y="180" class="b">inside her own turn, from her</text>
  <text x="38" y="197" class="b">state and her day, like any</text>
  <text x="38" y="214" class="b">other pop-up: no extra call.</text>
  <text x="38" y="238" class="l">a hang-up while ringing is recorded</text>

  <rect x="24" y="272" width="220" height="62" rx="10" fill="#fdf1eb" stroke="#eb6834"/>
  <text x="38" y="295" class="bt">Lets it ring out</text>
  <text x="38" y="316" class="b">the same turn's words go out as text</text>

  <path d="M134 252 V268" class="w" marker-end="url(#a)"/>
  <path d="M244 160 H284" class="w" marker-end="url(#a)"/>
  <text x="263" y="150" class="l" text-anchor="middle">picks</text><text x="263" y="180" class="l" text-anchor="middle">up</text>

  <!-- the call loop -->
  <rect x="288" y="84" width="688" height="250" rx="10" fill="#ffffff" stroke="#8a8984"/>
  <text x="302" y="107" class="bt">2  The call: a local voice client talks to the harness over HTTP</text>
  <text x="302" y="126" class="l">the harness launches the client pointed at 127.0.0.1:8790/call/&lt;id&gt;</text>

  <rect x="302" y="142" width="190" height="176" rx="8" fill="#f4f3f0" stroke="#d9d8d3"/>
  <text x="316" y="164" class="bt">Voice client</text>
  <text x="316" y="186" class="b">speech to text for him</text>
  <text x="316" y="204" class="b">her voice, sentence by</text>
  <text x="316" y="221" class="b">sentence, as it streams</text>
  <text x="316" y="243" class="b">he can talk over her:</text>
  <text x="316" y="260" class="b">her reply stops there</text>
  <text x="316" y="284" class="l">a heartbeat; 30 s of silence</text>
  <text x="316" y="300" class="l">ends the call (rig lost)</text>

  <rect x="766" y="142" width="196" height="176" rx="8" fill="#eef4fc" stroke="#2a78d6"/>
  <text x="780" y="164" class="bt">Session</text>
  <text x="780" y="186" class="b">the ordinary request: same</text>
  <text x="780" y="203" class="b">prefix and stream, so the</text>
  <text x="780" y="220" class="b">provider cache still holds</text>
  <text x="780" y="242" class="b">reasoning off for a fast</text>
  <text x="780" y="259" class="b">first sentence</text>
  <text x="780" y="281" class="b">call start and end are</text>
  <text x="780" y="298" class="b">system rows in the stream</text>

  <path d="M496 166 H762" class="w" marker-end="url(#a)"/>
  <text x="510" y="160" class="m">POST /turn</text>
  <text x="590" y="160" class="l">what he said</text>
  <path d="M762 202 H496" class="w" marker-end="url(#a)"/>
  <text x="510" y="196" class="l">her reply as Server-Sent Events, one sentence each</text>
  <path d="M496 244 H762" class="w" marker-end="url(#a)"/>
  <text x="510" y="238" class="m">POST /heard</text>
  <text x="600" y="238" class="l">what he actually heard, and if cut</text>
  <text x="510" y="264" class="b">Only the heard text is stored as her line,</text>
  <text x="510" y="281" class="b">so her history matches what he heard.</text>
  <text x="510" y="306" class="m">/heartbeat  /end  GET status</text>

  <!-- numbers -->
  <rect x="24" y="356" width="952" height="180" rx="10" fill="#f4f3f0" stroke="#d9d8d3"/>
  <text x="38" y="380" class="bt">Live run, 3 to 10 October 2026</text>
  <text x="250" y="380" class="l">seed 8001, deepseek-v4.1-flash; aggregate counts from the run database, no call content</text>

  <text x="38" y="424" class="big">5</text>
  <text x="38" y="446" class="b">incoming calls decided</text>
  <text x="38" y="463" class="l">4 picked up, 1 let ring out</text>

  <text x="230" y="424" class="big">25 min</text>
  <text x="230" y="446" class="b">of calls in total</text>
  <text x="230" y="463" class="l">5, 7, 5 and 8 minutes (rounded)</text>

  <text x="420" y="424" class="big">62</text>
  <text x="420" y="446" class="b">voice turns</text>
  <text x="420" y="463" class="l">11, 15, 15 and 21 per call</text>

  <text x="600" y="424" class="big">16</text>
  <text x="600" y="446" class="b">replies cut off by him</text>
  <text x="600" y="463" class="l">14 before a word was heard;</text>
  <text x="600" y="480" class="l">48 heard lines stored</text>

  <text x="800" y="424" class="big">94.4%</text>
  <text x="800" y="446" class="b">of voice-turn prompt</text>
  <text x="800" y="463" class="b">tokens served from cache</text>
  <text x="800" y="480" class="l">1.13M of 1.20M</text>

  <text x="38" y="524" class="p">Sources: state_events (call_decided, call_ended, call_heard) and llm_calls rows tagged voice, in results/live-companion/companion.db (not committed).</text>
</svg>
