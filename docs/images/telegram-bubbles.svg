<svg xmlns="http://www.w3.org/2000/svg" width="960" height="672" viewBox="0 0 960 672" role="img" aria-labelledby="t d">
  <title id="t">Telegram delivery: one reply, several bubbles</title>
  <desc id="d">The model writes one reply with line breaks. It is stored as one row, split into bubbles, and sent in order: the typing indicator covers generation and the response delay, the first bubble goes out at once, and each later bubble waits a pause that grows with its length.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
    .h { font-size: 20px; font-weight: 600; }
    .sub { font-size: 13px; fill: #52514e; }
    .bt { font-size: 14px; font-weight: 600; }
    .b { font-size: 12.5px; fill: #2b2a28; }
    .m { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #1f4f8f; }
    .n { font-size: 11.5px; fill: #52514e; }
    .chat { font-size: 13px; fill: #0b0b0b; }
    .ax { font-size: 11px; fill: #52514e; }
  </style>
  <rect x="0" y="0" width="960" height="672" rx="14" fill="#fcfcfb" stroke="#d9d8d3"/>

  <text x="30" y="40" class="h">Telegram delivery: one reply, several bubbles</text>
  <text x="30" y="61" class="sub">harness/bubbles.py, harness/runtime.py, harness/channels/telegram.py (with HARNESS_BUBBLES=1 and HARNESS_TYPING=1)</text>

  <!-- left: the four steps -->
  <g>
    <rect x="30" y="84" width="440" height="90" rx="10" fill="#eef4fc" stroke="#2a78d6"/>
    <text x="46" y="108" class="bt">1  The system prompt allows it</text>
    <text x="46" y="130" class="b">One line is appended to the stable prompt:</text>
    <text x="46" y="148" class="m">"You can answer in more than one message.</text>
    <text x="46" y="164" class="m"> A blank line is one send."</text>

    <rect x="30" y="196" width="440" height="74" rx="10" fill="#eef4fc" stroke="#2a78d6"/>
    <text x="46" y="220" class="bt">2  The model writes one reply</text>
    <text x="46" y="242" class="b">It is stored as ONE assistant row (the stream stays append-only);</text>
    <text x="46" y="260" class="b"><tspan class="m">parse_bubbles</tspan> splits it on every run of line breaks.</text>

    <rect x="30" y="292" width="440" height="74" rx="10" fill="#fdf1eb" stroke="#eb6834"/>
    <text x="46" y="316" class="bt">3  Typing while she writes</text>
    <text x="46" y="338" class="b">Generation plus <tspan class="m">response_delay_s</tspan> (a behavior control) run</text>
    <text x="46" y="356" class="b">inside <tspan class="m">typing_context()</tspan>; the indicator is refreshed every 4.5 s.</text>

    <rect x="30" y="388" width="440" height="92" rx="10" fill="#eaf7f1" stroke="#1baf7a"/>
    <text x="46" y="412" class="bt">4  Bubbles go out in order</text>
    <text x="46" y="434" class="b">The first is sent at once. Each later bubble first waits</text>
    <text x="46" y="452" class="m">gap = clamp(1.0 + 0.5 * len / 80, 0.6, 2.5) s</text>
    <text x="46" y="471" class="b">Each send is MarkdownV2; an RP <tspan class="m">*span*</tspan> renders as italics.</text>

    <path d="M250 174 V194" stroke="#52514e" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M250 270 V290" stroke="#52514e" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M250 366 V386" stroke="#52514e" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- right: the real example as a chat -->
  <g>
    <rect x="500" y="84" width="430" height="396" rx="16" fill="#e9eef3" stroke="#c9d2dc"/>
    <text x="518" y="108" class="n">A real reply from the live two-week run (day 1), as it arrives</text>

    <!-- typing indicator -->
    <rect x="518" y="122" width="150" height="34" rx="14" fill="#ffffff" stroke="#d3d9e0"/>
    <circle cx="540" cy="139" r="4" fill="#8a96a3"/>
    <circle cx="555" cy="139" r="4" fill="#a9b3bd"/>
    <circle cx="570" cy="139" r="4" fill="#c5ccd3"/>
    <text x="584" y="143" class="n">typing...</text>
    <text x="680" y="135" class="n">generation +</text>
    <text x="680" y="150" class="n">response_delay_s</text>

    <!-- bubble 1 -->
    <rect x="518" y="170" width="330" height="128" rx="14" fill="#ffffff" stroke="#d3d9e0"/>
    <text x="534" y="194" class="chat">Honestly? A couple of hours, at least.</text>
    <text x="534" y="213" class="chat">I sat down with the intention of</text>
    <text x="534" y="232" class="chat">skimming one section and came up for</text>
    <text x="534" y="251" class="chat">air well past it [...] The coffee going</text>
    <text x="534" y="270" class="chat">cold was my only real clock.</text>
    <text x="534" y="289" class="n">bubble 1: 233 characters, sent at once</text>

    <!-- pause -->
    <path d="M540 304 V350" stroke="#eb6834" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="540" cy="304" r="3.5" fill="#eb6834"/>
    <circle cx="540" cy="350" r="3.5" fill="#eb6834"/>
    <text x="556" y="322" class="b">pause before bubble 2:</text>
    <text x="556" y="341" class="m">1.0 + 0.5 * 58 / 80 = 1.36 s</text>

    <!-- bubble 2 -->
    <rect x="518" y="358" width="330" height="72" rx="14" fill="#ffffff" stroke="#d3d9e0"/>
    <text x="534" y="382" class="chat">Do you get like that with anything?</text>
    <text x="534" y="401" class="chat">Where hours just slip?</text>
    <text x="534" y="420" class="n">bubble 2: 58 characters</text>
    <text x="518" y="452" class="n">[...] marks text elided here; the full reply is message 10 in</text>
    <text x="518" y="467" class="n">results/live-two-weeks/companion.db.</text>
  </g>

  <!-- bottom left: the pause curve -->
  <g>
    <text x="30" y="514" class="bt">Pause before a bubble vs its length</text>
    <!-- plot area x 80..450, y 520..610 ; x: 0..400 chars ; y: 0..3 s -->
    <line x1="80" y1="626" x2="450" y2="626" stroke="#b9b8b3"/>
    <line x1="80" y1="536" x2="80" y2="626" stroke="#b9b8b3"/>
    <line x1="80" y1="596" x2="450" y2="596" stroke="#ecebe7"/>
    <line x1="80" y1="566" x2="450" y2="566" stroke="#ecebe7"/>
    <line x1="80" y1="536" x2="450" y2="536" stroke="#ecebe7"/>
    <text x="72" y="630" class="ax" text-anchor="end">0</text>
    <text x="72" y="600" class="ax" text-anchor="end">1 s</text>
    <text x="72" y="570" class="ax" text-anchor="end">2 s</text>
    <text x="72" y="540" class="ax" text-anchor="end">3 s</text>
    <text x="80" y="644" class="ax" text-anchor="middle">0</text>
    <text x="172.5" y="644" class="ax" text-anchor="middle">100</text>
    <text x="265" y="644" class="ax" text-anchor="middle">200</text>
    <text x="357.5" y="644" class="ax" text-anchor="middle">300</text>
    <text x="450" y="644" class="ax" text-anchor="middle">400</text>
    <text x="265" y="659" class="ax" text-anchor="middle">bubble length (characters)</text>
    <!-- 1.0 s at 0 chars, 2.5 s at 240 chars, flat after; x = 80 + len*0.925, y = 610 - s*30 -->
    <polyline points="80,596 302,551 450,551" fill="none" stroke="#1baf7a" stroke-width="2.4"/>
    <line x1="80" y1="608" x2="450" y2="608" stroke="#a9a8a3" stroke-dasharray="3 3"/>
    <text x="446" y="619" class="ax" text-anchor="end">0.6 s floor (never reached: the gap starts at 1.0 s)</text>
    <text x="306" y="546" class="ax">2.5 s cap from 240 characters</text>
    <circle cx="133.7" cy="585.2" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/>
    <text x="92" y="564" class="ax">58 chars: 1.36 s</text>
  </g>

  <!-- bottom right: streaming note -->
  <g>
    <rect x="500" y="512" width="430" height="128" rx="10" fill="#f4f3f0" stroke="#d9d8d3"/>
    <text x="518" y="536" class="bt">Optional: HARNESS_BUBBLE_STREAM=1</text>
    <text x="518" y="559" class="b">The reply streams in, and <tspan class="m">BubbleStreamer</tspan> releases each</text>
    <text x="518" y="578" class="b">bubble as soon as its boundary parses. A line break after an</text>
    <text x="518" y="597" class="b">unfinished sentence is held as a possible wrap. The joined reply</text>
    <text x="518" y="616" class="b">is still the one stored row, byte for byte.</text>
  </g>
</svg>
