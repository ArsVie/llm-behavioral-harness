[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-harness"
version = "0.1.0"
description = "Arnés conductual para LLM — motor emocional y actuadores de comportamiento"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "pytest-cov>=5", "coverage>=7", "radon>=6", "vulture>=2"]
channels = ["python-telegram-bot>=21"]

[tool.setuptools]
packages = ["engine", "sim", "harness", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -n 8: the suite is dominated by asyncio pacing sleeps, not CPU, so it
#   parallelises almost linearly. Capped at 8 rather than `auto` on purpose:
#   the cvs cell runner (experiments/cvs_common._run_segment) drives user
#   feeds off a REAL-clock poll, so once workers outnumber the cores it
#   starves and drops feeds — tests/test_cvs_tracks.py goes red at -n 16 and
#   is stable at -n 8, at identical wall time. Raise this only after that
#   runner stops polling the wall clock.
# -m 'not slow': keeps the experiment-scale ablation gate out of the default
#   run. Run it with `pytest -m slow`; run everything with `pytest -m ''`.
addopts = "-q -n 8 -m 'not slow'"
markers = [
    "slow: experiment-scale run (full ablation matrix over the 30-day confirmatory horizon). Minutes, not seconds - excluded from the default suite, run explicitly with `-m slow`.",
]

[tool.coverage.run]
branch = false
source = ["engine", "harness", "sim", "behavioral_signature"]
omit = ["*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
# The agreed floor. Coverage is measured over the WHOLE suite including the
# slow ablation gate:
#   pytest -m '' --cov --cov-report=term-missing
# The default (fast) suite alone reads lower - it deliberately skips the
# 30-day matrix - so do not gate CI on that number.
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mutmut]
# Mutation testing, scoped to engine/ deliberately. The engine is the FROZEN
# contract layer — mood, cycle, circadian, hazard timing, seed-keyed RNG — so
# a surviving mutant there means a stochastic law nothing pins, which is the
# failure that would quietly invalidate every experiment downstream. It is
# also small (~920 lines) with a 154-test, 1.5 s subset, so a full sweep
# finishes in minutes rather than the hours harness/ would take.
#
#   .venv/bin/mutmut run          # sweep
#   .venv/bin/mutmut results      # what survived
#   .venv/bin/mutmut show <id>    # the diff for one mutant
#
# Widening to harness/ is the next step and needs its own budget.
source_paths = ["engine"]
# -n 0 is REQUIRED, not a preference: mutmut runs pytest in-process with an
# injected plugin, so the -n 8 in [tool.pytest.ini_options] addopts would
# push collection into xdist workers the plugin cannot hook — mutmut then
# reports only "runner returned 5". These args land after addopts, so the
# later -n wins.
pytest_add_cli_args = ["-n", "0", "-p", "no:cacheprovider"]
# Must be a LIST: mutmut passes this through verbatim, so a single
# whitespace-joined string becomes one nonexistent path.
# The engine-facing set. It has to include the REPLAY tests, not just the
# per-module unit tests: with only the latter, replacing day_rng's whole
# SeedSequence with None survives, which would read as "determinism is
# unpinned" when in truth the tests that pin it were simply not selected.
pytest_add_cli_args_test_selection = [
    "tests/test_mood.py",
    "tests/test_cycle.py",
    "tests/test_circadian.py",
    "tests/test_timing.py",
    "tests/test_validation.py",
    "tests/test_snapshot.py",
    "tests/test_session.py",
    "tests/test_adversarial_restart.py",
    "tests/test_scheduler.py",
    "tests/test_proactive.py",
    "tests/test_behavior.py",
    "tests/test_persona.py",
    "tests/test_run_daily.py",
]
